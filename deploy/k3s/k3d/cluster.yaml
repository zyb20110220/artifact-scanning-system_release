apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: artifact-scanning
servers: 1
agents: 2
# 将 containerd 镜像仓库配置（registries.yaml）挂载到所有节点，
# 使集群能从 HTTP 的 Harbor 拉取镜像
volumes:
  - volume: C:/Users/zyb/source/repos/artifact-scanning-system/deploy/k3s/registries.yaml:/etc/rancher/k3s/registries.yaml
    nodeFilters:
      - server:*
      - agent:*
  # 持久化数据卷：把每个节点的 local-path 数据目录（PVC 实际存储位置）
  # 挂载到工作区 cluster-data/ 下，使集群 down/up 或迁移工作区后数据不丢失。
  # 每个节点使用独立子目录，避免多节点写同一目录产生冲突。
  - volume: C:/Users/zyb/source/repos/artifact-scanning-system/cluster-data/server-0:/var/lib/rancher/k3s/storage
    nodeFilters:
      - server:0
  - volume: C:/Users/zyb/source/repos/artifact-scanning-system/cluster-data/agent-0:/var/lib/rancher/k3s/storage
    nodeFilters:
      - agent:0
  - volume: C:/Users/zyb/source/repos/artifact-scanning-system/cluster-data/agent-1:/var/lib/rancher/k3s/storage
    nodeFilters:
      - agent:1
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  # 显式暴露 Harbor 的 NodePort
  - port: 30002:30002
    nodeFilters:
      - loadbalancer
  # 显式暴露监控栈 NodePort：Grafana 30003 / Prometheus 30004
  - port: 30003:30003
    nodeFilters:
      - loadbalancer
  - port: 30004:30004
    nodeFilters:
      - loadbalancer
