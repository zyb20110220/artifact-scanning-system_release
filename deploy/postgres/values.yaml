# ============================================================
# values.yaml —— bitnami/postgresql 配置（阶段 1.4 元数据库）
# 部署：deploy/postgres/install.ps1
# ============================================================

# 镜像：latest 对应 PostgreSQL 18.6.0
# digest: sha256:40a261ed77f3b8dc65eeeec98bb79c4d3ef3410d7e2af7cfcf3785a6af00e4c5
image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: latest

# 认证（开发环境固定密码；生产建议用 existingSecret）
auth:
  postgresPassword: "artifactpg2026"
  username: "artifact"
  password: "artifact2026"   # 自定义用户 artifact 的密码
  database: "artifactdb"

primary:
  service:
    type: ClusterIP
    ports:
      postgresql: 5432
  # 数据持久化到 local-path（随 cluster-data 挂载，可备份迁移）
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 10Gi
