// ============================================================
// feature.proto —— 特征提取服务接口（阶段 2.1）
// 服务端常驻缓存模型，接收图像字节或 URL，返回 L2 归一化特征。
// ============================================================
syntax = "proto3";

package feature;

// 特征提取服务
service FeatureService {
  // 批量提取：输入一组图像（字节或 URL），返回特征向量
  rpc ExtractFeatures (ExtractRequest) returns (ExtractReply);
  // 健康检查 / 模型信息
  rpc GetModelInfo (ModelInfoRequest) returns (ModelInfoReply);
}

message ExtractRequest {
  repeated bytes image = 1;        // 原始图像字节（与 image_url 二选一）
  repeated string image_url = 2;   // 图像 URL（服务端下载，需配置代理）
  string model = 3;                // 模型名，缺省 dinov2-base
}

message ExtractReply {
  uint32 dim = 1;                  // 特征维度
  repeated Feature features = 2;   // 与请求一一对应（失败处为空向量）
  repeated string errors = 3;      // 每项错误消息（无错为空串）
}

message Feature {
  repeated float vector = 1;
}

message ModelInfoRequest {
  string model = 1;
}

message ModelInfoReply {
  string model = 1;
  uint32 dim = 2;
  string device = 3;
}
